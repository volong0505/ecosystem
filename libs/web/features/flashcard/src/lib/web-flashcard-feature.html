<div class="container">
  <nz-card>
    <div>
      <div class="card-header">
        <div>
          <span class="word">{{word.translation}}</span>
        </div>

        <div class="tags">
          @for (tag of word.partsOfSpeech; track tag) {
          <shared-ui-tag-component [tagText]="tag" />
          }
        </div>
      </div>

      <div class="card-center">

        <div class="meaning">
          <span>{{word.meaning}}</span>
        </div>

        <div>
          <input  [(ngModel)]="value" [nzStatus]="status" (ngModelChange)="compare()" nz-input nzSize="large" />
        </div>


        @if(this.isCorrect() == true) {
        <div class="sentences">
          <div class="sentences-title"> Sentences: </div>
          @for(sentence of word.examples; track sentence) {
          <div>
            <div class="sentence">{{sentence.sentence}} ({{sentence.meaning}})</div>
          </div>
        }

        </div>
           }
      </div>

      <div class="card-footer ">
        <div class="check-button">
        <nz-icon  nzType="check" nzTheme="outline" />
        </div>
      </div>
    </div>

  </nz-card>
</div>
