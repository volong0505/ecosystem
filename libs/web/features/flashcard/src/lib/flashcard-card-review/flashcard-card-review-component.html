<nz-card>

    <div>
        <div class="card-header">
            <div>
                <span class="word">{{store.flashcard.data().translation}}</span>
            </div>

            <div class="tags">
                <shared-ui-tag-component [tagText]="store.flashcard.data().partOfSpeech" />
            </div>

            <div class="check-button">
                <shared-ui-button-component [disabled]="!isCorrect()" buttonText="Next"
                    (shareClicked)="nextFlashcard()" />

                <!-- <button nz-button nzType="primary" (click)="nextFlashcard()">
        Next
      <nz-icon nzType="right" />
      </button> -->
            </div>
        </div>

        <div class="card-center">
            <div>
                <form nz-form [formGroup]="validateForm" class="login-form" (ngSubmit)="nextFlashcard()">
                    <nz-form-item>
                        <nz-form-control>
                            <input [(ngModel)]="value" [nzStatus]="status" (ngModelChange)="compare()" nz-input
                                nzSize="large" [ngModelOptions]="{standalone: true}" />
                        </nz-form-control>
                    </nz-form-item>

                </form>
            </div>

            @if(this.isCorrect() == true) {
            <div class="hide">
                <div>
                    <span>{{store.flashcard.data().ipa}}</span>
                </div>

                <div class="definition">
                    <div class="definition-title"> Definitons: </div>
                    @for(def of store.flashcard.data().definitions; track def) {
                    <div>
                        <div class="definition-translation">{{def.translation}}</div>
                        <div class="definition-example">{{def.example}}</div>

                    </div>
                    }

                </div>
            </div>

            }
        </div>

        <div class="card-footer">
            <div class="hint">
                <a class="hint-text" (click)="hint()"> <nz-icon nzType="bulb" nzTheme="outline" /> Get a hint</a>
            </div>

            @if(this.isCorrect() == true) {
            <div class="memorized">
                <a>
                    Already memorized
                </a>
            </div>
            }
        </div>
    </div>
</nz-card>
