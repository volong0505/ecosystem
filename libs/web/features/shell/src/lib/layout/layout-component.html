<div class="container">
  <nz-tabs nzType="card" nzLinkRouter>
    @for(tab of tabs; track tab)
    {
    <nz-tab >
       <a *nzTabLink nz-tab-link [routerLink]="tab.path">
          {{tab.label}}
        </a>
    </nz-tab>
    }
  </nz-tabs>
  <div class="main">
  <router-outlet/>
  </div>

</div>
