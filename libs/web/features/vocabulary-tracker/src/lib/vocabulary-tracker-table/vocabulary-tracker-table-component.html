<div class="table-ctn">
  <div class="table-header">
    <div nz-row>
      <div nz-col nzSpan="12">
        <div nz-flex>

          <!-- create form -->
          <div class="btn">
            <shared-ui-button-component buttonText="+ New" (shareClicked)="store.openDrawer()" />
          </div>

          <!-- search form -->
          <div>
            <form nz-form [formGroup]="searchForm" (ngSubmit)="submitForm()">
              <nz-form-item>
                <nz-form-control>
                  <nz-input-group [nzSuffix]="suffixIconSearch">
                    <input formControlName="keyword" type="text" nz-input placeholder="Search" />
                  </nz-input-group>
                  <ng-template #suffixIconSearch>
                    <nz-icon nzType="search" />
                  </ng-template>
                </nz-form-control>
              </nz-form-item>
            </form>
          </div>
        </div>
      </div>

      <div nz-col nzSpan="12">
        <!-- data statistical -->
        <div class="statistical">
          <span>
            Total: {{store.list.total()}}
          </span>
        </div>
      </div>
    </div>
  </div>

  <nz-table [nzData]="store.list.data()" [nzShowPagination]="false" #nzTable nzTableLayout="fixed">
    <thead>
      <tr>
        <th nzWidth="2%"></th>
        <th nzWidth="8%">Word</th>
        <th nzWidth="12%">Translation</th>
        <th nzWidth="12%">IPA</th>
        <th nzWidth="5%">Level</th>
        <th nzWidth="10%">Part Of Speech</th>
        <th nzWidth="5%"></th>
      </tr>
    </thead>
    <tbody>
      @for (data of store.list.data(); track data) {
      <tr>
        <td [nzExpand]="expandSet.has(data._id)" (nzExpandChange)="onExpandChange(data._id, $event)"></td>
        <td>{{ data.word }}</td>
        <td>{{ data.translation }}</td>
        <td>
          {{ data.ipa}}
        </td>

        <td>{{ data.level}}</td>
        <td>
          <nz-tag>
            {{ data.partOfSpeech}}
          </nz-tag>
        </td>

        <td class="action">
          <a (click)="onEdit(data._id)"><nz-icon nzType="edit" nzTheme="outline" /></a>
          <nz-divider nzType="vertical"></nz-divider>
          <a>
            <nz-icon nzType="delete" nzTheme="outline" />
          </a>
        </td>
      </tr>
      }
    </tbody>
  </nz-table>

  <div class="pagin-ctn">
    <nz-pagination [nzPageSize]="12" [nzPageIndex]="currentPage" [nzTotal]="total" [nzSize]="'small'"
      (nzPageIndexChange)="pageChange($event)"></nz-pagination>
  </div>
</div>
