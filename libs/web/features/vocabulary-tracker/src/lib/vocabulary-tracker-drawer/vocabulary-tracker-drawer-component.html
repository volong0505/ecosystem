<nz-drawer [nzClosable]="false" nzWidth="500px" nzPlacement="left" [nzKeyboard]="true" (nzOnClose)="store.closeDrawer()"
    [nzVisible]="store.drawer.isOpen()">
    <ng-container *nzDrawerContent>
        <!-- <div>
            <nz-spin nzTip="Asking..." [nzSpinning]="isSpinning">

                <form [formGroup]="askAIForm" (ngSubmit)="onAskAi()">
                    <nz-form-item>
                        <nz-form-control>
                            <input type="text" nz-input formControlName="word" placeholder="Ask AI"
                                nzVariant="underlined" />
                        </nz-form-control>
                    </nz-form-item>
                </form>
            </nz-spin>
        </div> -->



        <div>
            <div class="form-container">
                <form nz-form [formGroup]="validateForm" class="login-form" >
                    <h5 nz-typography>Vocabulary</h5>

                    <nz-form-item>
                        <nz-form-control>
                            <input type="text" nz-input formControlName="word" placeholder="Word"
                                nzVariant="underlined" /> </nz-form-control>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-control>
                            <input nz-input formControlName="translation" nz-input placeholder="Translation"
                                nzVariant="underlined" />
                        </nz-form-control>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-control>
                            <input type="text" nz-input formControlName="ipa" placeholder="IPA"
                                nzVariant="underlined" />
                        </nz-form-control>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-control [nzSm]="12" [nzXs]="24">
                            <nz-select class="select-left" formControlName="level" nzVariant="underlined"
                                nzPlaceHolder="Level">
                                <nz-option nzValue="A1" nzLabel="A1"></nz-option>
                                <nz-option nzValue="A2" nzLabel="A2"></nz-option>
                                <nz-option nzValue="B1" nzLabel="B1"></nz-option>
                                <nz-option nzValue="B2" nzLabel="B2"></nz-option>
                                <nz-option nzValue="C1" nzLabel="C1"></nz-option>
                            </nz-select>
                        </nz-form-control>

                        <nz-form-control [nzSm]="12" [nzXs]="24">
                            <nz-select class="select-right" formControlName="partOfSpeech" nzVariant="underlined"
                                nzPlaceHolder="Parts of Speech">
                                @for( part of partsOfSpeechOptions; track part.value) {
                                <nz-option [nzValue]="part.value" [nzLabel]="part.label"></nz-option>
                                }
                            </nz-select>
                        </nz-form-control>
                    </nz-form-item>

                    <nz-form-item>
                        <nz-form-control>
                            <textarea formControlName="usageNote" nz-input rows="1" placeholder="Usage Note"
                                nzVariant="underlined"></textarea>
                        </nz-form-control>
                    </nz-form-item>

      </form>



                    <div class="definitions-container">
                        <h5 nz-typography>Definitions</h5>

                        <div>
                            @for( s of definitions; track s.id) {
                            <div class="definitions-element">
                                <div class="definitions-element-header">
                                    <span>{{s.id}}</span>

                                    <a class="definitions-element-delete" nz-button nzDanger
                                        (click)="removeDefinition(s.id)"><nz-icon nzType="delete"
                                            nzTheme="outline" /></a>
                                </div>
                                <input class="definitions-input" type="text" nz-input placeholder="Definition"
                                    [(ngModel)]="s.translation" nzVariant="underlined" />

                                <input class="definitions-input" type="text" nz-input placeholder="Meaning"
                                    nzVariant="underlined" [(ngModel)]="s.explanation" />

                                <input class="definitions-input" type="text" nz-input placeholder="Note"
                                    nzVariant="underlined" [(ngModel)]="s.note" />

                                <input class="definitions-input" type="text" nz-input placeholder="Example"
                                    nzVariant="underlined" [(ngModel)]="s.example" />

                                <input class="definitions-input" type="text" nz-input placeholder="Dịch"
                                    nzVariant="underlined" [(ngModel)]="s.exampleVi" />
                            </div>
                            }
                        </div>

                        <div>
                            <button nz-button nzType="dashed" class="add-button" (click)="addDefinition($event)">
                                <nz-icon nzType="plus" />
                                Add definition
                            </button>
                        </div>
                    </div>

                    <div>
                        <button nz-button nzType="primary" class="submit-button" (click)="submitForm()">
                            <nz-icon nzType="save" />
                            Save
                        </button>
                    </div>
          
            </div>
        </div>

        @if(isExisted.status) {
        <div class="alert">
            <nz-alert nzType="warning" nzMessage="This word already exists" nzShowIcon>
            </nz-alert>
        </div>
        }
    </ng-container>
</nz-drawer>
